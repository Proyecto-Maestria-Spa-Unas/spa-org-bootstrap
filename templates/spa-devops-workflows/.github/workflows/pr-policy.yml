# Política de PR: nombre de rama según flujo de ramas y título Conventional Commits.
# Check resultante en el repo que lo invoca: "politica / pr"
name: pr-policy
on:
  workflow_call:

permissions:
  contents: read

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - name: Validar rama y título
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          echo "PR: $HEAD → $BASE"
          case "$BASE" in
            main)
              [[ "$HEAD" =~ ^(develop|release/[0-9]+\.[0-9]+\.[0-9]+|hotfix/[a-z0-9._-]+)$ ]] \
                || { echo "::error::A 'main' solo llegan develop, release/x.y.z o hotfix/*"; exit 1; } ;;
            develop)
              [[ "$HEAD" =~ ^(feature|fix|chore|docs|test|refactor|ci|perf)/[A-Za-z0-9._-]+$ || "$HEAD" =~ ^(main|hotfix/.+|release/.+)$ ]] \
                || { echo "::error::Rama '$HEAD' no cumple el patrón tipo/descripcion (ej. feature/HU-07-registrar-salida)"; exit 1; } ;;
          esac
          [[ "$TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?:\ .{5,}$ ]] \
            || { echo "::error::Título no cumple Conventional Commits: 'tipo(alcance): descripción'"; exit 1; }
          if [[ "$HEAD" =~ ^feature/ ]] && ! grep -Eq 'HU-[0-9]{2}' <<<"$HEAD $TITLE $BODY"; then
            echo "::warning::El PR de una feature debería referenciar una historia de usuario (HU-xx)"
          fi
          echo "Política de PR cumplida ✔"
