# CI de base de datos: aplica TODAS las migraciones sobre PostgreSQL+PostGIS limpio,
# carga seeds y ejecuta pruebas SQL. Check resultante: "calidad / pipeline"
name: db-ci
on:
  workflow_call:
    inputs:
      migrations-dir: { type: string, default: "supabase/migrations" }
      tests-dir: { type: string, default: "tests/sql" }
      seed-file: { type: string, default: "supabase/seed.sql" }

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: spa
    steps:
      - uses: actions/checkout@v4
      - name: Emular roles de Supabase (anon, authenticated, service_role) y esquema auth
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/supabase_shim.sql
      - name: Aplicar migraciones en orden
        run: |
          set -euo pipefail
          for f in $(ls ${{ inputs.migrations-dir }}/*.sql | sort); do
            echo "▶ $f"; psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Cargar seeds
        run: '[ -f "${{ inputs.seed-file }}" ] && psql -v ON_ERROR_STOP=1 -q -f "${{ inputs.seed-file }}" || echo "sin seed"'
      - name: Pruebas SQL
        run: |
          set -euo pipefail
          for f in $(ls ${{ inputs.tests-dir }}/*.sql | sort); do
            echo "▶ $f"; psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Idempotencia de migraciones (re-aplicación)
        run: |
          set -euo pipefail
          for f in $(ls ${{ inputs.migrations-dir }}/*.sql | sort); do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
