apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-api-v1
  namespace: spa-inventario
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend-api-v1 }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
