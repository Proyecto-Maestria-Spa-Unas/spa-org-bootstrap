apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api-v1
  namespace: spa-inventario
  labels: { app: backend-api, version: v1 }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: backend-api, version: v1 }
  template:
    metadata:
      labels: { app: backend-api, version: v1 }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/spa-unas/backend-api-staging:v1
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - secretRef: { name: backend-api-env }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
