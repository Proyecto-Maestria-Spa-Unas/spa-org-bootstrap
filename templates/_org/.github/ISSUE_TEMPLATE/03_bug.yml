name: Bug
description: Reporte de defecto
labels: ["bug"]
body:
  - type: textarea
    id: pasos
    attributes: { label: Pasos para reproducir, value: "1. \n2. \n3. " }
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes: { label: Resultado esperado }
    validations: { required: true }
  - type: textarea
    id: obtenido
    attributes: { label: Resultado obtenido }
    validations: { required: true }
  - type: dropdown
    id: entorno
    attributes: { label: Entorno, options: [local, development, staging, production] }
    validations: { required: true }
  - type: input
    id: hu
    attributes: { label: Historia de usuario relacionada, placeholder: "HU-07" }
